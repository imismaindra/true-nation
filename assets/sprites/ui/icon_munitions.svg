<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="munitGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <!-- Background Badge Diamond -->
  <polygon points="32,4 58,32 32,60 6,32" fill="#18181b" stroke="url(#munitGrad)" stroke-width="2"/>
  <!-- Artillery Shell 1 (Left slant) -->
  <g transform="rotate(-15 32 32)">
    <!-- Warhead Tip -->
    <path d="M26,14 C26,14 29,8 32,8 C35,8 38,14 38,14 L38,20 L26,20 Z" fill="url(#munitGrad)"/>
    <!-- Shell Body -->
    <rect x="26" y="20" width="12" height="28" fill="#3f3f46" stroke="url(#munitGrad)" stroke-width="1.5"/>
    <!-- Explosive Ring Band -->
    <rect x="26" y="24" width="12" height="4" fill="#fbbf24"/>
    <rect x="26" y="42" width="12" height="3" fill="#991b1b"/>
    <!-- Shell Base -->
    <rect x="24" y="48" width="16" height="4" rx="1" fill="#71717a"/>
  </g>
  <!-- Tactical Thrust Sparks / Fins -->
  <polygon points="18,48 24,54 18,56" fill="url(#munitGrad)"/>
  <polygon points="46,48 40,54 46,56" fill="url(#munitGrad)"/>
</svg>

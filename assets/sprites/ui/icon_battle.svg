<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <!-- Combat Reticle -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#f87171" stroke-width="1.5"/>
  <line x1="32" y1="2" x2="32" y2="12" stroke="#ef4444" stroke-width="2"/>
  <line x1="32" y1="52" x2="32" y2="62" stroke="#ef4444" stroke-width="2"/>
  <line x1="2" y1="32" x2="12" y2="32" stroke="#ef4444" stroke-width="2"/>
  <line x1="52" y1="32" x2="62" y2="32" stroke="#ef4444" stroke-width="2"/>
  <!-- Crossed Tactical Combat Blades -->
  <g stroke="#18181b" stroke-width="1.5">
    <!-- Blade 1 (top-left to bottom-right) -->
    <polygon points="16,12 20,10 48,46 44,48" fill="url(#redGrad)"/>
    <polygon points="16,12 12,16 18,22 22,18" fill="#cbd5e1"/>
    <rect x="46" y="46" width="6" height="6" rx="1" fill="#71717a"/>
    <!-- Blade 2 (top-right to bottom-left) -->
    <polygon points="44,10 48,12 20,48 16,46" fill="url(#redGrad)"/>
    <polygon points="48,12 52,16 46,22 42,18" fill="#cbd5e1"/>
    <rect x="12" y="46" width="6" height="6" rx="1" fill="#71717a"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="armsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <!-- Background Badge Hexagon -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#111827" stroke="url(#armsGrad)" stroke-width="2"/>
  <!-- Tactical Assault Rifle Silhouette (Angled 25 deg or Horizontal) -->
  <g fill="url(#armsGrad)" stroke="#111827" stroke-width="0.5">
    <!-- Barrel & Flash Hider -->
    <rect x="10" y="27" width="16" height="3" rx="1"/>
    <rect x="8" y="26" width="3" height="5" rx="0.5"/>
    <rect x="18" y="25" width="2" height="3"/> <!-- Gas Block / Front Sight -->
    <!-- Handguard / Picatinny Rail -->
    <rect x="24" y="26" width="14" height="6" rx="1"/>
    <!-- Upper & Lower Receiver -->
    <rect x="36" y="25" width="12" height="8" rx="1"/>
    <!-- Optical Sight / Scope -->
    <rect x="34" y="21" width="10" height="4" rx="1"/>
    <rect x="32" y="22" width="2" height="2"/>
    <rect x="44" y="22" width="2" height="2"/>
    <!-- Curved Magazine -->
    <path d="M35,33 L32,45 C32,46 34,47 37,47 L39,33 Z"/>
    <!-- Pistol Grip -->
    <path d="M43,33 L45,44 C45,45 48,45 49,43 L48,33 Z"/>
    <!-- Stock / Buffer Tube -->
    <rect x="48" y="27" width="8" height="3"/>
    <polygon points="53,27 57,25 57,35 53,34"/>
  </g>
</svg>

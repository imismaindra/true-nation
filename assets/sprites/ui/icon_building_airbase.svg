<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="airGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="52" height="52" rx="8" fill="#0f172a" stroke="url(#airGrad)" stroke-width="2"/>
  <!-- Runway Strip (trapezoid in perspective) -->
  <polygon points="26,12 38,12 48,54 16,54" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <!-- Dashed Centerline of Runway -->
  <line x1="32" y1="16" x2="32" y2="22" stroke="#f8fafc" stroke-width="2"/>
  <line x1="32" y1="26" x2="32" y2="34" stroke="#f8fafc" stroke-width="2.5"/>
  <line x1="32" y1="38" x2="32" y2="48" stroke="#f8fafc" stroke-width="3"/>
  <!-- Jet Fighter Ascending -->
  <polygon points="32,18 36,26 44,28 36,31 37,35 32,33 27,35 28,31 20,28 28,26" fill="url(#airGrad)" stroke="#f0f9ff" stroke-width="1"/>
</svg>
